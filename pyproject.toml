[project]
name = "cine"
version = "0.1.0"
description = "Recomendador pessoal baseado na watchlist do Letterboxd"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-ollama>=1.0,<2",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
markers = [
  "ollama: requer uma instância local do Ollama e execução opt-in",
  "tmdb: requer TMDB_API_TOKEN e execução opt-in",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".agents"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cine"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app.py", "models.py", "tmdb.py", "agents", "tools"]
